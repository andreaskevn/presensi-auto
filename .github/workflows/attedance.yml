name: Attendance Bot

on:
  schedule:
    # 07:55 WIB = 00:55 UTC
    - cron: "55 0 * * 1-5"

  workflow_dispatch:

jobs:
  attendance:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browser
        run: npx playwright install chromium --with-deps

      - name: Run Attendance
        env:
          FORM_URL: ${{ secrets.FORM_URL }}
          NIK: ${{ secrets.NIK }}
          NAME: ${{ secrets.NAME }}
        run: node index.js